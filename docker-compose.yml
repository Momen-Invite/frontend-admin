services:
  frontend-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: momeninvite-frontend-admin
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8001}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
